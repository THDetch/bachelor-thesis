name: pytorch-img2img
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.4.0
  - torchvision=0.19.0
  - pytorch-cuda=12.1
  - numpy
  - scikit-image
  - scipy
  - tqdm
  - rasterio
  - matplotlib
  - pillow
  - pip
  - pip:
      - dominate>=2.8.0
      - wandb>=0.16.0
      - lpips>=0.1.4
      - torchmetrics>=1.4.0
